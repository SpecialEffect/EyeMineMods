name: Preview Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read build config
        id: config
        run: |
          JAVA=$(grep '^java_version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$JAVA" ]; then
            echo "::error::java_version is not set in gradle.properties. Add java_version=21 (or 17) to gradle.properties before building."
            exit 1
          fi
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.config.outputs.java_version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyemine-${{ github.ref_name }}-${{ github.sha }}
          path: '*/build/libs/eyemine-*[0-9].jar'
          if-no-files-found: warn
          retention-days: 14
