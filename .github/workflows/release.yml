name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release (e.g. "1.21" or "architectury_1.21")'
        required: true
      publish_to_curseforge:
        description: 'Publish to CurseForge'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch
        id: resolve
        run: |
          INPUT="${{ inputs.branch }}"
          for CANDIDATE in "$INPUT" "architectury_$INPUT"; do
            if git ls-remote --heads origin "refs/heads/$CANDIDATE" | grep -q .; then
              echo "branch=$CANDIDATE" >> "$GITHUB_OUTPUT"
              echo "Resolved '$INPUT' to branch '$CANDIDATE'."
              exit 0
            fi
          done
          echo "::error::No branch found matching '$INPUT'. Use a full branch name (e.g. 'architectury_1.21') or just the version (e.g. '1.21')."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}

      - name: Read build config
        id: config
        run: |
          JAVA=$(grep '^java_version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$JAVA" ]; then
            echo "::error::java_version is not set in gradle.properties on branch '${{ steps.resolve.outputs.branch }}'. Add java_version=21 (or 17) to gradle.properties before releasing."
            exit 1
          fi
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          PLATFORMS=$(grep '^enabled_platforms=' gradle.properties | cut -d'=' -f2)
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="forge"
          fi
          echo "Version: $VERSION (MC $MC_VERSION, Java $JAVA, platforms: $PLATFORMS)"
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.config.outputs.java_version }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyemine-${{ steps.config.outputs.mc_version }}-${{ steps.config.outputs.version }}
          path: '*/build/libs/eyemine-*[0-9].jar'
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to CurseForge
        if: inputs.publish_to_curseforge == true
        run: |
          CURSEFORGE_TASKS=""
          for platform in $(echo "${{ steps.config.outputs.platforms }}" | tr ',' ' '); do
            if ./gradlew :${platform}:tasks --all 2>/dev/null | grep -q "^curseforge "; then
              CURSEFORGE_TASKS="$CURSEFORGE_TASKS :${platform}:curseforge"
            else
              echo "::warning::No curseforge task found in :${platform} — skipping."
            fi
          done
          if [ -z "$CURSEFORGE_TASKS" ]; then
            echo "::error::No curseforge tasks found on this branch. Add the CurseForge Gradle plugin to the platform build.gradle files."
            exit 1
          fi
          ./gradlew $CURSEFORGE_TASKS
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
